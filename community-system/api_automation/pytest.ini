[pytest]
# 测试路径
testpaths = tests

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    p0: P0 级别用例
    p1: P1 级别用例
    p2: P2 级别用例
    security: 安全测试
    performance: 性能测试

# 输出选项
addopts =
    -v
    --tb=short
    --color=yes
    --html=reports/api_test_report.html
    --self-contained-html

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
