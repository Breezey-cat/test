<svg xmlns="http://www.w3.org/2000/svg" width="880" height="820" viewBox="0 0 880 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#6c757d"/>
    </marker>
  </defs>

  <rect width="880" height="820" fill="#ffffff"/>

  <!-- ===== Layer 1: 用户层 ===== -->
  <rect x="120" y="20" width="640" height="60" rx="6" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
  <text x="440" y="44" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">用户层</text>
  <text x="280" y="66" font-size="11" text-anchor="middle" fill="#bdc3c7">系统管理员</text>
  <text x="600" y="66" font-size="11" text-anchor="middle" fill="#bdc3c7">业主 / 住户</text>

  <line x1="440" y1="80" x2="440" y2="100" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== Layer 2: 前端层 ===== -->
  <rect x="60" y="105" width="760" height="170" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1.5"/>
  <text x="440" y="127" font-size="13" font-weight="700" text-anchor="middle" fill="#2c3e50">前端层 (Vue 3 + Vite + Element Plus)</text>

  <!-- AdminLayout box -->
  <rect x="90" y="140" width="330" height="120" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="255" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">管理员后台</text>
  <text x="255" y="178" font-size="10" text-anchor="middle" fill="#d4eef9">AdminLayout.vue</text>
  <line x1="110" y1="188" x2="400" y2="188" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="255" y="205" font-size="10" text-anchor="middle" fill="#d4eef9">用户/楼宇/房屋管理</text>
  <text x="255" y="222" font-size="10" text-anchor="middle" fill="#d4eef9">报修/投诉处理 · 费用/停车管理</text>
  <text x="255" y="239" font-size="10" text-anchor="middle" fill="#d4eef9">公告/新闻/论坛管理</text>
  <text x="255" y="256" font-size="10" text-anchor="middle" fill="#d4eef9">数据统计可视化 (ECharts)</text>

  <!-- FrontLayout box -->
  <rect x="460" y="140" width="330" height="120" rx="5" fill="#5dade2" stroke="#3498db" stroke-width="1"/>
  <text x="625" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">用户前台</text>
  <text x="625" y="178" font-size="10" text-anchor="middle" fill="#e8f4fc">FrontLayout.vue</text>
  <line x1="480" y1="188" x2="770" y2="188" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <text x="625" y="205" font-size="10" text-anchor="middle" fill="#e8f4fc">首页 · 公告/新闻浏览</text>
  <text x="625" y="222" font-size="10" text-anchor="middle" fill="#e8f4fc">论坛交流 · 个人中心</text>
  <text x="625" y="239" font-size="10" text-anchor="middle" fill="#e8f4fc">在线缴费 (物业/水电/停车费)</text>
  <text x="625" y="256" font-size="10" text-anchor="middle" fill="#e8f4fc">报修/投诉提交 · 余额充值</text>

  <!-- Arrows from frontend to auth -->
  <line x1="255" y1="275" x2="255" y2="295" stroke="#6c757d" stroke-width="1.5"/>
  <line x1="625" y1="275" x2="625" y2="295" stroke="#6c757d" stroke-width="1.5"/>
  <line x1="255" y1="295" x2="625" y2="295" stroke="#6c757d" stroke-width="1.5"/>
  <line x1="440" y1="295" x2="440" y2="310" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== Layer 3: 认证拦截层 ===== -->
  <rect x="120" y="315" width="640" height="55" rx="6" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="440" y="338" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">认证拦截层</text>
  <text x="440" y="358" font-size="11" text-anchor="middle" fill="#fef5e7">LoginInterceptor  +  JwtUtils (HS256)  +  ThreadLocal  +  GlobalExceptionHandler</text>

  <line x1="440" y1="370" x2="440" y2="390" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== Layer 4: API 控制层 ===== -->
  <rect x="60" y="395" width="760" height="125" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="440" y="417" font-size="13" font-weight="700" text-anchor="middle" fill="#2c3e50">API 控制层 (20 个 Controller)</text>

  <rect x="80" y="428" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="160" y="447" font-size="10" text-anchor="middle" fill="#ffffff">/common/*  登录/注册/密码</text>

  <rect x="255" y="428" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="335" y="447" font-size="10" text-anchor="middle" fill="#ffffff">/admin/*  /user/*  用户管理</text>

  <rect x="430" y="428" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="510" y="447" font-size="10" text-anchor="middle" fill="#ffffff">/building/*  /house/*  房屋</text>

  <rect x="605" y="428" width="190" height="30" rx="4" fill="#27ae60"/>
  <text x="700" y="447" font-size="10" text-anchor="middle" fill="#ffffff">/repair/*  /complaint/*  服务</text>

  <rect x="80" y="468" width="160" height="30" rx="4" fill="#2ecc71"/>
  <text x="160" y="487" font-size="10" text-anchor="middle" fill="#ffffff">/announcement/*  公告</text>

  <rect x="255" y="468" width="160" height="30" rx="4" fill="#2ecc71"/>
  <text x="335" y="487" font-size="10" text-anchor="middle" fill="#ffffff">/news/*  /forum/*  资讯</text>

  <rect x="430" y="468" width="160" height="30" rx="4" fill="#2ecc71"/>
  <text x="510" y="487" font-size="10" text-anchor="middle" fill="#ffffff">/parkingLot/*  /parkingSpace/*</text>

  <rect x="605" y="468" width="190" height="30" rx="4" fill="#2ecc71"/>
  <text x="700" y="487" font-size="10" text-anchor="middle" fill="#ffffff">/propertyFee/* /utilityBillFee/* /parkingFee/*</text>

  <rect x="255" y="505" width="370" height="0" fill="none"/>

  <line x1="440" y1="520" x2="440" y2="540" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== Layer 5: 服务层 ===== -->
  <rect x="60" y="545" width="760" height="100" rx="6" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="440" y="567" font-size="13" font-weight="700" text-anchor="middle" fill="#2c3e50">服务层 (Service + ServiceImpl)</text>

  <rect x="80" y="578" width="170" height="26" rx="4" fill="#f1c40f"/>
  <text x="165" y="595" font-size="9" text-anchor="middle" fill="#7d6608">CommonService  AdminService</text>

  <rect x="265" y="578" width="170" height="26" rx="4" fill="#f1c40f"/>
  <text x="350" y="595" font-size="9" text-anchor="middle" fill="#7d6608">UserService  FileService</text>

  <rect x="450" y="578" width="170" height="26" rx="4" fill="#f1c40f"/>
  <text x="535" y="595" font-size="9" text-anchor="middle" fill="#7d6608">BuildingService  HouseService</text>

  <rect x="635" y="578" width="165" height="26" rx="4" fill="#f1c40f"/>
  <text x="717" y="595" font-size="9" text-anchor="middle" fill="#7d6608">RepairService  ComplaintSvc</text>

  <rect x="80" y="612" width="170" height="26" rx="4" fill="#f7dc6f"/>
  <text x="165" y="629" font-size="9" text-anchor="middle" fill="#7d6608">AnnouncementSvc  NewsService</text>

  <rect x="265" y="612" width="170" height="26" rx="4" fill="#f7dc6f"/>
  <text x="350" y="629" font-size="9" text-anchor="middle" fill="#7d6608">ForumService  CommentsService</text>

  <rect x="450" y="612" width="170" height="26" rx="4" fill="#f7dc6f"/>
  <text x="535" y="629" font-size="9" text-anchor="middle" fill="#7d6608">ParkingLotSvc  ParkingSpaceSvc</text>

  <rect x="635" y="612" width="165" height="26" rx="4" fill="#f7dc6f"/>
  <text x="717" y="629" font-size="9" text-anchor="middle" fill="#7d6608">PropertyFeeSvc  UtilityBillSvc</text>

  <line x1="440" y1="645" x2="440" y2="665" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== Layer 6: 数据层 ===== -->
  <rect x="60" y="670" width="760" height="130" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="440" y="692" font-size="13" font-weight="700" text-anchor="middle" fill="#2c3e50">数据层 (MySQL 5.7+ · MyBatis ORM)</text>

  <rect x="80" y="703" width="120" height="26" rx="4" fill="#e67e22"/>
  <text x="140" y="720" font-size="9" text-anchor="middle" fill="#ffffff">admin · user</text>

  <rect x="215" y="703" width="120" height="26" rx="4" fill="#e67e22"/>
  <text x="275" y="720" font-size="9" text-anchor="middle" fill="#ffffff">building · house</text>

  <rect x="350" y="703" width="120" height="26" rx="4" fill="#e67e22"/>
  <text x="410" y="720" font-size="9" text-anchor="middle" fill="#ffffff">repair · complaint</text>

  <rect x="485" y="703" width="120" height="26" rx="4" fill="#e67e22"/>
  <text x="545" y="720" font-size="9" text-anchor="middle" fill="#ffffff">news · forum</text>

  <rect x="620" y="703" width="180" height="26" rx="4" fill="#e67e22"/>
  <text x="710" y="720" font-size="9" text-anchor="middle" fill="#ffffff">news_comment · forum_comment</text>

  <rect x="80" y="738" width="120" height="26" rx="4" fill="#f0b27a"/>
  <text x="140" y="755" font-size="9" text-anchor="middle" fill="#6e2c00">announcement</text>

  <rect x="215" y="738" width="120" height="26" rx="4" fill="#f0b27a"/>
  <text x="275" y="755" font-size="9" text-anchor="middle" fill="#6e2c00">parking_lot</text>

  <rect x="350" y="738" width="120" height="26" rx="4" fill="#f0b27a"/>
  <text x="410" y="755" font-size="9" text-anchor="middle" fill="#6e2c00">parking_space</text>

  <rect x="485" y="738" width="120" height="26" rx="4" fill="#f0b27a"/>
  <text x="545" y="755" font-size="9" text-anchor="middle" fill="#6e2c00">property_fee</text>

  <rect x="620" y="738" width="180" height="26" rx="4" fill="#f0b27a"/>
  <text x="710" y="755" font-size="9" text-anchor="middle" fill="#6e2c00">utility_bill_fee · parking_fee</text>

  <rect x="80" y="772" width="720" height="22" rx="4" fill="#fae5d3"/>
  <text x="440" y="787" font-size="9" text-anchor="middle" fill="#6e2c00">comments (通用评论表, type: 1=新闻 2=论坛)</text>
</svg>
